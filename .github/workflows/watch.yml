name: Check Stock

on:
  schedule:
    - cron: '0 * * * *' # 1時間に1回実行
  workflow_dispatch:

# ボットによるリポジトリへの書き込み（git push）を許可する権限
permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
          
      - name: Run watcher script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python guitar_stock_watcher.py
          
      - name: Commit updated watched items
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add watched_items.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update watched_items.json [skip ci]"
          git pull origin main --rebase || true
          git push
